<style>
:root{
  --navy:#0B2552; --navy2:#123A78; --blue:#1F5BB5; --accent:#00A0CA;
  --ink:#16202E; --sub:#5B6676; --line:#DCE3EC; --bg:#F2F5F9; --card:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 16px}

/* header */
.hd{background:#fff;border-bottom:1px solid var(--line)}
.hd .wrap{height:52px;display:flex;align-items:center;justify-content:space-between}
.hd-logo svg{height:22px;width:auto;display:block}
.hd .wrap{gap:12px}
.hd-tag{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.02em;text-align:right;line-height:1.4}

/* FV */
.fv{position:relative;overflow:hidden;min-height:140px;display:flex;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff}
.fv::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 100% 0%,rgba(0,160,202,.35) 0%,rgba(0,160,202,0) 55%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 22px)}
.fv-mark{position:absolute;right:-28px;bottom:-22px;width:190px;opacity:.10}
.fv-mark polygon{fill:#fff}
.fv-line{display:block}
.fv-in{position:relative;display:flex;align-items:center;padding-top:18px;padding-bottom:18px}
.fv .fv-copy{margin:0;width:100%;--fmax:26;--fmin:15;word-break:auto-phrase;font-size:26px;font-weight:900;line-height:1.4;color:#fff;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.fv .wrap{position:relative;padding-top:26px;padding-bottom:26px}
.fv-eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;color:#9FD9EA;margin-bottom:8px}
.fv h1{font-size:23px;font-weight:900;line-height:1.4;letter-spacing:.02em}
.fv h1 span{display:inline-block}
.fv p{margin-top:10px;font-size:13px;line-height:1.75;color:rgba(255,255,255,.86)}

/* section */
.sec{padding:20px 0 4px}
.sec-ttl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:10px}
.sec-ttl::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--blue)}

/* service tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}
.tile{position:relative;display:flex;align-items:center;min-height:62px;padding:9px 26px 9px 13px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:box-shadow .15s,transform .15s}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#999)}
.tile::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;border-top:2px solid var(--c,#1F5BB5);border-right:2px solid var(--c,#1F5BB5);transform:translateY(-50%) rotate(45deg)}
.tile:hover{box-shadow:0 4px 14px rgba(11,37,82,.12);transform:translateY(-1px)}
.tile-in{display:flex;flex-direction:column;gap:6px;min-width:0;width:100%}
.tile-lbl .nb{display:inline-block}
.tile-lbl{font-size:11px;font-weight:500;line-height:1.45;color:var(--sub)}
.tile-logo{height:var(--h,20px);width:auto;max-width:100%;object-fit:contain;object-position:left center}
.tile.wide{grid-column:1/-1;min-height:58px}
.tile.wide .tile-in{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
.tile.wide .tile-lbl{min-width:0;margin-left:auto;text-align:left}
.tile.wide .tile-logo{flex:none;max-width:46%}

/* app */
.app{margin-top:12px;border-radius:12px;background:linear-gradient(135deg,#123A78 0%,#0B2552 100%);color:#fff;padding:14px 14px 12px;position:relative;overflow:hidden}
.app::before{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(0,160,202,.35),rgba(0,160,202,0) 70%)}
.app-hd{position:relative;display:flex;gap:11px;align-items:center}
.app-icon{flex:none;width:48px;height:48px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.app-icon svg{width:34px;height:auto}
.app-badge{display:table;margin-bottom:3px;font-size:10px;font-weight:900;letter-spacing:.06em;background:#E8432E;color:#fff;border-radius:3px;padding:1px 6px}
.app-ttl{font-size:15px;font-weight:700;line-height:1.4}
.app-sub{font-size:11.5px;color:rgba(255,255,255,.82);margin-top:2px}
.stores{position:relative;display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.store{display:block;line-height:0;transition:opacity .15s}
.store svg,.store img{height:44px;width:auto;display:block}
.store:hover{opacity:.85}
.store[aria-disabled="true"]{cursor:default}
.biz{position:relative;display:flex;justify-content:flex-end;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.18)}
.biz a{font-size:12px;color:#fff;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.biz a:hover{text-decoration:underline}
.biz a::after{content:"→";font-size:12px}

/* recruit */
.rec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:8px;font-weight:700;font-size:14px;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.pri{background:var(--blue);color:#fff}
.btn.sec2{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}

/* footer */
.ft{margin-top:28px;padding:16px 0 22px;text-align:center;font-size:11px;color:var(--sub)}
.ft a{text-decoration:underline}

@media (min-width:768px){
  .hd .wrap{height:64px}
  .hd-logo svg{height:28px}
  .hd-tag{font-size:14px}
  .fv{min-height:240px}
  .fv .fv-copy{--fmax:44;--fmin:24;font-size:44px}
  .fv-eyebrow{font-size:12px}
  .fv h1{font-size:38px}
  .fv p{font-size:15px}
  .fv-mark{width:340px;right:4%;bottom:-40px}
  .sec{padding:36px 0 4px}
  .sec-ttl{font-size:18px;margin-bottom:14px}
  .grid{grid-template-columns:repeat(3,1fr);gap:12px}
  .tile{min-height:84px;padding:14px 32px 14px 18px}
  .tile-lbl{font-size:13px}
  .tile-logo{height:var(--hp,26px)}
  .main2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
  .main2 .tile.wide,.main2 .app{margin-top:0;height:100%}
  .main2 .tile.wide{grid-column:auto;padding:20px 36px 20px 22px}
  .main2 .tile.wide .tile-lbl{margin-left:0}
  .main2 .tile.wide .tile-in{flex-direction:column;align-items:flex-start;justify-content:center;gap:14px}
  .app{padding:20px}
  .rec{max-width:520px}
}
@media (max-width:359px){
  .hd-logo svg{height:19px}
  .hd-tag{font-size:10px;white-space:nowrap;letter-spacing:0}
  .fv h1{font-size:20px}
  .tile-lbl{font-size:10.5px}
}
</style>
</head>

<script>
(function(){
  /* ===== 公開前にここだけ記入 ===== */
  // AppsFlyer シングルプラットフォームのアトリビューションリンク（pid=mv_yt_tieup 入り）をそのまま貼る
  var APP_STORE_URL   = 'https://app.appsflyer.com/id6760753543?pid=mv_yt_tieup&c=hub01';  // iOS（AppsFlyer: 転職ならマイビジョン）
  var GOOGLE_PLAY_URL = 'https://app.appsflyer.com/jp.co.my_vision.platform?pid=mv_yt_tieup&c=hub01';  // Android（AppsFlyer: マイビジョン）
  var CORP_HR_URL     = 'https://my-vision.co.jp/inquiry';  // 企業人事向けページのURL

  /* FVコピーの出し分け：URLの ?fv=キー に対応する文言を表示（改行は \n）。
     キーが無い・未登録のときは DEFAULT を表示。URLに文言そのものは載せない（なりすまし防止） */
  var FV_COPY = {
    DEFAULT: 'ここを本番コピーで置き換えるためのスペース！！！',
    sample:  'ここを本番コピーで置き換えるためのスペース！！！',
    pd:      '○○チャンネルをご覧の方に\nMyVisionのサービスをご紹介します。'
  };
  /* =============================== */

  /* ストアリンクへ流入パラメータを変換して付与（AppsFlyerのキャンペーン分解用）
     utm_campaign→c ／ utm_term→af_adset ／ utm_content→af_ad ／ fv→af_sub1 ／ utm_source→af_sub2 ／ utm_medium→af_sub3
     値が来ていない項目はリンクに書いた初期値のまま。pid は上書きしない */
  var AF_MAP = { utm_campaign:'c', utm_term:'af_adset', utm_content:'af_ad', fv:'af_sub1', utm_source:'af_sub2', utm_medium:'af_sub3' };
  function afLink(base){
    if (!base) return base;
    try {
      var u = new URL(base), q = new URLSearchParams(location.search);
      Object.keys(AF_MAP).forEach(function(k){ var v = q.get(k); if (v) u.searchParams.set(AF_MAP[k], v); });
      return u.toString();
    } catch(e){ return base; }
  }
  APP_STORE_URL = afLink(APP_STORE_URL); GOOGLE_PLAY_URL = afLink(GOOGLE_PLAY_URL);

  var ios = document.getElementById('st-ios'), and = document.getElementById('st-and');

  function setHref(el, url){
    if (url) { el.href = url; el.removeAttribute('aria-disabled'); }
    else { el.removeAttribute('href'); el.setAttribute('aria-disabled','true'); }
  }
  setHref(ios, APP_STORE_URL); setHref(and, GOOGLE_PLAY_URL);
  setHref(document.getElementById('biz-link'), CORP_HR_URL);

  // FVコピー
  (function(){
    var key = new URLSearchParams(location.search).get('fv');
    var txt = (key && Object.prototype.hasOwnProperty.call(FV_COPY, key)) ? FV_COPY[key] : FV_COPY.DEFAULT;
    var el = document.getElementById('fv-copy'); el.textContent = '';
    txt.split('\n').forEach(function(line){ var s = document.createElement('span'); s.className = 'fv-line'; s.textContent = line; el.appendChild(s); });
    // 各行が1行に収まる最大の文字サイズに自動調整（上限〜下限。下限でも収まらない行だけ折り返す）
    function fit(){
      var cs = getComputedStyle(el), max = parseFloat(cs.getPropertyValue('--fmax')) || 26, min = parseFloat(cs.getPropertyValue('--fmin')) || 17;
      var lines = el.querySelectorAll('.fv-line');
      el.style.fontSize = max + 'px';
      lines.forEach(function(s){ s.style.whiteSpace = 'nowrap'; });
      var w = el.clientWidth, widest = 0;
      lines.forEach(function(s){ widest = Math.max(widest, s.scrollWidth); });
      var size = widest > w ? Math.floor(max * w / widest * 10) / 10 : max;
      if (size < min) { size = min; lines.forEach(function(s){ s.style.whiteSpace = 'normal'; }); }
      el.style.fontSize = size + 'px';
    }
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    var tm; window.addEventListener('resize', function(){ clearTimeout(tm); tm = setTimeout(fit, 100); });
  })();

  // 流入時のクエリパラメータを総て、アプリストア以外の全リンクに引き継ぐ（ストアは上の afLink で AppsFlyer 形式に変換済みのため対象外）
  var q = new URLSearchParams(location.search), keep = [];
  q.forEach(function(v,k){ keep.push([k,v]); });
  if (keep.length) {
    document.querySelectorAll('a[href^="http"]').forEach(function(a){
      if (a.hasAttribute('data-nocarry')) return;
      try {
        var u = new URL(a.href);
        keep.forEach(function(p){ if (!u.searchParams.has(p[0])) u.searchParams.append(p[0], p[1]); });
        a.href = u.toString();
      } catch(e){}
    });
  }
})();
</script>
